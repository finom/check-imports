version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # the types follow the oldest supported Node.js (engines), so typecheck catches a newer API
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # init and analyze fail on different versions
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
